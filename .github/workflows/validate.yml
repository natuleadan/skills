name: Validate Skills

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            subject=$(git log -1 --format='%s' "$sha")
            echo "$subject" | grep -qE '^Merge ' && continue
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            python3 tools/check-commit.py /tmp/commit-msg.txt
          done

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate all skills
        run: python3 tools/validate-all.py

  tag:
    name: Tag
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "leojara95"
          git config user.email "268038834+leojara95@users.noreply.github.com"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists; nothing to release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          fi

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r "dist/skills_${TAG}.zip" skills tools README.md SKILLS.md CONTRIBUTING.md AGENTS.md LICENSE NOTICE
          ls -la dist/

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.zip
