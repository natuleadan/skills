name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all skills
        run: python3 tools/validate-all.py

  tag:
    name: Tag
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "leojara95"
          git config user.email "268038834+leojara95@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          if [ "$LATEST" = "v0.0.0" ]; then
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            echo "First release: v0.0.1"
            exit 0
          fi
          COMMITS=$(git log "$LATEST..HEAD" --format="%s%b" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since $LATEST"
            exit 0
          fi
          if echo "$COMMITS" | grep -qE '^.*?\([^)]*\)?!:|^BREAKING[ -]CHANGE:'; then
            if [ "$MAJOR" = "0" ]; then
              echo "tag=v0.$((MINOR+1)).0" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v$((MAJOR+1)).0.0" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$COMMITS" | grep -q '^feat'; then
            echo "tag=v$MAJOR.$((MINOR+1)).0" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE '^fix|^perf'; then
            echo "tag=v$MAJOR.$MINOR.$((PATCH+1))" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No functional changes"
          fi

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r "dist/skills_${TAG}.zip" skills tools README.md CONTRIBUTING.md AGENTS.md LICENSE NOTICE
          ls -la dist/

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
