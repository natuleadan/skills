name: Version Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-packages
  cancel-in-progress: true

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "leojara95"
          git config user.email "268038834+leojara95@users.noreply.github.com"

      - name: Open or update the version pull request
        uses: changesets/action@v1
        with:
          version-script: pnpm run version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: true
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
